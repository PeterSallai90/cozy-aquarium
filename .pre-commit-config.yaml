repos:
  - repo: https://github.com/Scony/godot-gdscript-toolkit
    rev: 4.5.0          # pinned at repository creation
    hooks:
      - id: gdformat
        exclude: ^game/addons/gdUnit4/
      - id: gdlint
        exclude: ^game/addons/gdUnit4/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
        exclude: ^game/(addons/gdUnit4|assets/fonts)/
      - id: trailing-whitespace
        exclude: ^game/(addons/gdUnit4|assets/fonts)/
      - id: check-added-large-files
        args: ["--maxkb=500"]   # large files must go through LFS
  - repo: local
    hooks:
      - id: check-project-settings
        name: check that project.godot keeps the required explicit lines
        entry: python tools/scripts/check_project_settings.py
        language: python
        files: ^game/project\.godot$
        pass_filenames: false
      - id: check-asset-licenses
        name: check that every asset and addon has a licence row
        entry: python tools/scripts/check_asset_licenses.py
        language: python
        files: ^game/(assets|addons)/|^docs/asset-licenses\.md$
        pass_filenames: false
