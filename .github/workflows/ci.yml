name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2" # must match docs/adr/0001-engine.md

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.5.0"
      - run: gdformat --check game
      - run: gdlint game
      - run: python tools/scripts/check_translations.py # every key in en.po and hu.po
      - run: python tools/scripts/check_asset_licenses.py # every asset logged

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          cd ~/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          rm "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
      - name: Install Godot
        run: |
          sudo install -m 755 ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --headless --version
      - name: Import project
        run: godot --headless --path game --import
      - name: Run tests
        run: |
          if [ ! -d game/addons/gdUnit4 ]; then
            echo "::notice::GdUnit4 is not installed yet (backlog issue B04); skipping tests."
            exit 0
          fi
          godot --headless --path game -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests --ignoreHeadlessMode
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: game/reports
          if-no-files-found: ignore

  build-windows:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/godot-export
          key: godot-${{ env.GODOT_VERSION }}-linux-templates
      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-export
          cd ~/godot-export
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "${base}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          rm ./*.zip ./*.tpz
      - name: Install Godot and export templates
        run: |
          sudo install -m 755 ~/godot-export/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp ~/godot-export/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          godot --headless --version
      - name: Import project
        run: godot --headless --path game --import
      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --path game --export-release "Windows Desktop" ../build/windows/CozyAquarium.exe
          test -f build/windows/CozyAquarium.exe
      - uses: actions/upload-artifact@v7
        with:
          name: CozyAquarium-windows-${{ github.sha }}
          path: build/windows
          retention-days: 14
